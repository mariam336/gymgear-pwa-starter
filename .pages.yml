media:
  input: public/uploads
  output: /uploads
  rename: safe
content:
  - name: reviews
    label: Individual reviews
    type: collection
    path: src/content/reviews
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:

      - name: title
        label: Article title
        type: string
        required: true
      - name: description
        label: Article summary
        type: text
        required: true
      - name: category
        type: select
        required: true
        options:
          values: [home-gym-equipment, strength-training, cardio-equipment, running-shoes, yoga-mobility, fitness-wearables, recovery-tools, workout-accessories]
      - name: date
        label: Publication date
        type: date
        required: true
      - name: updated
        label: Actual updated date (optional)
        type: date
      - name: status
        type: select
        options:
          values: [draft, demo, published]
      - name: author
        type: string
      - name: image
        label: Article illustration or licensed image
        type: image
      - name: featured
        type: boolean
      - name: verdict
        type: text
      - name: bestFor
        type: text
      - name: notFor
        type: text
      - name: productIds
        label: Matching product IDs
        type: string
        list: true
      - name: pros
        type: string
        list: true
      - name: cons
        type: string
        list: true
      - name: seoTitle
        type: string
      - name: seoDescription
        type: text
      - name: body
        type: rich-text
